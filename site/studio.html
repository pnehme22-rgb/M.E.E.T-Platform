<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Your studio | M.E.E.T.</title>
<meta name="theme-color" content="#f6f0e5">
<link rel="icon" href="/assets/img/brand/mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="/assets/css/app.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.js" defer></script>
<script src="/assets/js/config.js" defer></script>
<script src="/assets/js/app/core.js" defer></script>
<script src="/assets/js/app/studio.js" defer></script>
</head>
<body>
<header class="hdr">
  <div class="hdr-in">
    <a class="logo" href="#/" aria-label="Studio home" id="logo"><span>M.E.E.T.</span><small>Studio</small></a>
    <div class="hdr-right">
      <span class="muted small" id="who"></span>
      <button class="btn line sm" type="button" data-signout>Sign out</button>
    </div>
  </div>
</header>

<div class="shell">
  <aside class="side" aria-label="Studio">
    <nav class="nav" id="nav" aria-label="Studio sections"></nav>
    <p class="side-note small muted">Only what the M.E.E.T. team approves is shown publicly. Your legal name, email and social links always stay private.</p>
  </aside>
  <main class="main" id="main" tabindex="-1" aria-live="polite">
    <p class="muted">Opening your studio</p>
  </main>
</div>
</body>
</html>
