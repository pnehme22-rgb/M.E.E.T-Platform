<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Team console | M.E.E.T.</title>
<meta name="theme-color" content="#f5efe1">
<link rel="icon" href="/assets/img/brand/mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/css/app.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" defer></script>
<script src="/assets/js/config.js" defer></script>
<script src="/assets/js/app/core.js" defer></script>
<script src="/assets/js/app/team.js" defer></script>
</head>
<body>
<header class="hdr">
  <div class="hdr-in">
    <a class="logo" href="#/overview" aria-label="Team console overview" id="logo"><span>M.E.E.T.</span><small>Team</small></a>
    <div class="hdr-right">
      <span class="muted small" id="who"></span>
      <button class="btn line sm" type="button" data-signout>Sign out</button>
    </div>
  </div>
</header>

<div class="shell">
  <aside class="side" aria-label="Console">
    <nav class="nav" id="nav" aria-label="Workspaces"></nav>
    <p class="side-note small muted">Every action here is recorded in the activity log. Artist details are private: please do not copy them outside the console.</p>
  </aside>
  <main class="main" id="main" tabindex="-1" aria-live="polite">
    <p class="muted">Loading the console</p>
  </main>
</div>
</body>
</html>
