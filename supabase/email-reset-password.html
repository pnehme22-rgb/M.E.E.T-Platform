<div style="background:#f5efe1;padding:32px 12px;font-family:Arial,Helvetica,sans-serif">
  <div style="max-width:560px;margin:0 auto;background:#fbf8f1;border:1px solid #e3d8c2;border-radius:18px;padding:36px 32px">
    <p style="font-family:Georgia,serif;font-size:22px;letter-spacing:.08em;color:#133458;margin:0 0 24px">M.E.E.T.</p>
    <p style="font-size:16px;line-height:1.6;color:#133458;margin:0 0 16px">Hello,</p>
    <p style="font-size:16px;line-height:1.6;color:#133458;margin:0 0 16px">We received a request to choose a new password for your M.E.E.T. account. Press the button below to continue.</p>
    <p style="margin:8px 0 24px"><a href="{{ .SiteURL }}/welcome?th={{ .TokenHash }}&type=recovery" style="display:inline-block;background:#790d16;color:#f5efe1;text-decoration:none;font-weight:bold;font-size:15px;padding:14px 28px;border-radius:999px">Choose a new password</a></p>
    <p style="font-size:15px;line-height:1.6;color:#133458;margin:0 0 16px">If you did not ask for this, you can ignore this email. Your password stays the same.</p>
    <p style="font-size:15px;line-height:1.6;color:#133458;margin:24px 0 0">With warm regards,<br>The M.E.E.T. team</p>
  </div>
</div>
